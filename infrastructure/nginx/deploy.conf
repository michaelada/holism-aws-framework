# One origin, four applications, an API and an identity provider.
#
# Everything is same-origin on purpose: no CORS to configure, one certificate,
# and the Vite bundles can call `/api/...` relatively. TLS is terminated in
# front of this by the host's nginx (see scripts/deploy/), or by this block
# directly when a certificate is present.

# Cache policy by URI.
#
# Expressed as a map rather than as regex `location` blocks, because a regex
# location *wins* over a prefix one — `/account/assets/x.js` would have matched
# a cache-header block that has no `alias`, and every asset would 404. This
# keeps one location per application, which is what serves the files.
map $uri $app_cache_control {
    default                                  "no-store";
    "~*/(account|orgadmin|admin|metadata)/assets/"  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, and names resolved per request rather than at
    # startup.
    #
    # With a plain `upstream` block nginx resolves the name once, when it
    # starts — so this container will not start at all unless `backend` and
    # `keycloak` already exist, and it keeps a stale address if either is
    # replaced. Resolving through a variable defers it: the container comes up
    # on its own, serves the static bundles regardless, and answers 502 for the
    # proxied paths until the other services are there.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Uploads: form submissions carry documents and images.
    client_max_body_size 25M;

    # Compression matters more than usual here — four SPA bundles, and the
    # instance this runs on is deliberately small.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- health
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------- API
    location /api/ {
        set $backend_host backend;
        # `$request_uri` because a `proxy_pass` containing a variable does not
        # append the matched path the way a literal one does.
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a report export, which builds a spreadsheet in-process.
        proxy_read_timeout 120s;
    }

    # Stripe's webhook needs the RAW body to verify its signature, and the
    # backend mounts that router before its JSON parser for exactly that
    # reason. Nothing here may buffer or alter it. Longest-prefix match means
    # this wins over /api/ above.
    location /api/webhooks/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------- Keycloak
    #
    # Served under /auth on the same origin, so the bundles' `VITE_KEYCLOAK_URL`
    # is `https://<host>/auth` and no second name or certificate is needed.
    #
    # The forwarded headers are not decoration: Keycloak builds every redirect
    # and issuer URL from them, and with them missing it hands out `http://`
    # links from behind TLS and the sign-in loop never closes.
    location /auth/ {
        set $keycloak_host keycloak;
        # No path rewriting: Keycloak is configured with
        # `KC_HTTP_RELATIVE_PATH: /auth`, so it serves under /auth itself.
        # Stripping the prefix here — which `proxy_pass http://keycloak/;` does —
        # would send every request one level above where Keycloak is listening.
        proxy_pass http://$keycloak_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_buffer_size   8k;
        proxy_buffers       8 8k;
    }

    # ------------------------------------------------------- the four bundles
    #
    # Each is a single-page application: unknown paths inside it must return the
    # app's own index.html so the router can handle them, or a refresh on any
    # deep link 404s.

    location ^~ /account/ {
        alias /usr/share/nginx/html/account/;
        try_files $uri $uri/ /account/index.html;
        add_header Cache-Control $app_cache_control always;
    }

    location ^~ /orgadmin/ {
        alias /usr/share/nginx/html/orgadmin/;
        try_files $uri $uri/ /orgadmin/index.html;
        add_header Cache-Control $app_cache_control always;
    }

    location ^~ /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control $app_cache_control always;
    }

    location ^~ /metadata/ {
        alias /usr/share/nginx/html/metadata/;
        try_files $uri $uri/ /metadata/index.html;
        add_header Cache-Control $app_cache_control always;
    }

    # Hashed assets never change under the same name, so they are immutable;
    # everything else — the entry documents and the service worker — must not be
    # cached, or a deploy leaves browsers running the previous bundle. Applied
    # through `$app_cache_control` above.

    # Bare paths, so /account works as well as /account/.
    location = /account  { return 301 /account/; }
    location = /orgadmin { return 301 /orgadmin/; }
    location = /admin    { return 301 /admin/; }
    location = /metadata { return 301 /metadata/; }

    # ---------------------------------------------------------------- landing
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
