parent=keycloak
import=common/keycloak

# Theme Styles - Choose one:
# Neumorphic Theme (teal/gray with soft shadows):
# styles=css/login.css css/neumorphic.css

# Warm Theme (orange/gold gradients):
# To switch to warm theme, comment out the line above and uncomment this:
styles=css/login.css css/warm.css

# The announcements column beside the sign-in form (docs/PLATFORM_POSTS.md).
scripts=js/posts.js

# Where the API lives. Empty is correct wherever nginx serves Keycloak and
# the API on one origin, which is every deployed environment; set it only for
# a split-host setup.
ipsApiBase=
