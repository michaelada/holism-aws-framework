parent=keycloak
import=common/keycloak

# `account.css` matches the account application's MUI theme, so the member does
# not cross a visual boundary between the organisation gateway and this page.
# `neumorphic.css` is the previous treatment, kept as the documented
# alternative — see docs/KEYCLOAK_THEME_SWITCHING.md. Only one should be listed.
styles=css/login.css css/account.css

# The announcements column beside the sign-in form (docs/PLATFORM_POSTS.md),
# and the line naming the club being signed in to
# (docs/KEYCLOAK_LOGIN_NAMES_THE_CLUB.md).
scripts=js/posts.js js/club.js

# Where the API lives. Empty is correct wherever nginx serves Keycloak and
# the API on one origin, which is every deployed environment; set it only for
# a split-host setup.
ipsApiBase=
