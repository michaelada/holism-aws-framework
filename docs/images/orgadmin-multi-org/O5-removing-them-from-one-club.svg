<rect class="bg" x="0" y="0" width="437.60" height="287.00" rx="6"/>
<path class="ln" fill="none" d="M19.9 24.5L409.9 24.5 M19.9 58.5L409.9 58.5 M43.3 143.5L409.9 143.5 M43.3 211.5L409.9 211.5 M19.9 262.5L409.9 262.5 M19.9 24.5L19.9 262.5 M43.3 143.5L43.3 211.5 M409.9 24.5L409.9 58.5 M409.9 143.5L409.9 211.5 M417.7 75.5L417.7 245.5"/>
<text class="tx" x="23.80" y="41.50" textLength="382.20" lengthAdjust="spacingAndGlyphs">  Remove Ada Adams?                           ✕  </text>
<text class="tx" x="23.80" y="92.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  They will no longer administer Kildare Hunt     </text>
<text class="tx" x="23.80" y="109.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  Pony Club.                                      </text>
<text class="tx" x="47.20" y="160.50" textLength="358.80" lengthAdjust="spacingAndGlyphs"> ℹ  Ada administers 2 other organisations.    </text>
<text class="tx" x="47.20" y="177.50" textLength="358.80" lengthAdjust="spacingAndGlyphs">    Their account and sign-in details are     </text>
<text class="tx" x="47.20" y="194.50" textLength="358.80" lengthAdjust="spacingAndGlyphs">    unaffected.                               </text>
<text class="tx" x="23.80" y="245.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">                    [ Cancel ]   [ Remove ]       </text>
</svg>
