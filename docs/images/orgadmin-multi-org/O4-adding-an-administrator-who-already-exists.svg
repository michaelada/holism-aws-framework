<text class="tx" x="23.80" y="41.50" textLength="382.20" lengthAdjust="spacingAndGlyphs">  Add an administrator                        ✕  </text>
<text class="tx" x="23.80" y="92.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  Email address                                   </text>
<text class="tx" x="47.20" y="126.50" textLength="358.80" lengthAdjust="spacingAndGlyphs"> ada@example.com                              </text>
<text class="tx" x="47.20" y="194.50" textLength="358.80" lengthAdjust="spacingAndGlyphs"> ℹ  Ada Adams already has an account on the   </text>
<text class="tx" x="47.20" y="211.50" textLength="358.80" lengthAdjust="spacingAndGlyphs">    platform. They will be given access to    </text>
<text class="tx" x="47.20" y="228.50" textLength="358.80" lengthAdjust="spacingAndGlyphs">    this organisation using their existing    </text>
<text class="tx" x="47.20" y="245.50" textLength="358.80" lengthAdjust="spacingAndGlyphs">    sign-in details — no new password.        </text>
<text class="tx" x="23.80" y="296.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  Role                                            </text>
<text class="tx" x="47.20" y="330.50" textLength="343.20" lengthAdjust="spacingAndGlyphs"> Club administrator                       ▾ </text>
<text class="tx" x="23.80" y="381.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">              [ Cancel ]   [ Add to this club ]   </text>
