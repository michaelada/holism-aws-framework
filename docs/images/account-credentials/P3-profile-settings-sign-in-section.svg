<svg xmlns="http://www.w3.org/2000/svg" width="640" height="321" viewBox="0 0 640.40 321.00" role="img" aria-label="P3 — Profile &amp; Settings, sign-in section">
<title>P3 — Profile &amp; Settings, sign-in section</title>
<style>
