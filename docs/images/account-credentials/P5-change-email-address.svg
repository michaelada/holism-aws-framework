<text class="tx" x="23.80" y="41.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  Change email address                        ✕   </text>
<text class="tx" x="23.80" y="92.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  You sign in with this address, so we will send  </text>
<text class="tx" x="23.80" y="109.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  a link to the new one to check it reaches you.  </text>
<text class="tx" x="23.80" y="126.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  Nothing changes until you follow it.            </text>
