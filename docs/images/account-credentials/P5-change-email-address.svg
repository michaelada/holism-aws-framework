<text class="tx" x="47.20" y="194.50" textLength="343.20" lengthAdjust="spacingAndGlyphs"> michael.adams@example.com                  </text>
<text class="tx" x="23.80" y="245.50" textLength="390.00" lengthAdjust="spacingAndGlyphs">  Current password                                </text>
