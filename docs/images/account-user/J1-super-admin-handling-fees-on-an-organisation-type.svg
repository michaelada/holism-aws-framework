<text class="tx" x="23.80" y="41.50" textLength="592.80" lengthAdjust="spacingAndGlyphs">  Organisation Types  ›  Create                                             </text>
<text class="tx" x="55.00" y="75.50" textLength="70.20" lengthAdjust="spacingAndGlyphs"> Details </text>
<text class="tx" x="47.20" y="92.50" textLength="546.00" lengthAdjust="spacingAndGlyphs">  Name *  [ pony-club ]     Display name *  [ Pony Club ]             </text>
<text class="tx" x="47.20" y="109.50" textLength="546.00" lengthAdjust="spacingAndGlyphs">  Currency * [ EUR ▾ ]      Default locale * [ en-GB ▾ ]              </text>
<text class="tx" x="55.00" y="160.50" textLength="109.20" lengthAdjust="spacingAndGlyphs"> Capabilities </text>
<text class="tx" x="47.20" y="177.50" textLength="546.00" lengthAdjust="spacingAndGlyphs">  ☑ event-management   ☑ memberships   ☑ event-ticketing   …          </text>
<text class="tx" x="55.00" y="228.50" textLength="156.00" lengthAdjust="spacingAndGlyphs"> Card handling fees </text>
<text class="tx" x="47.20" y="245.50" textLength="546.00" lengthAdjust="spacingAndGlyphs">  Every organisation of this type charges these handling fees on      </text>
<text class="tx" x="47.20" y="262.50" textLength="546.00" lengthAdjust="spacingAndGlyphs">  card payments. Defaults are pre-filled — change them if needed.     </text>
<text class="tx" x="70.60" y="313.50" textLength="507.00" lengthAdjust="spacingAndGlyphs"> Pay By Card (Stripe)                                            </text>
<text class="tx" x="70.60" y="347.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">  Fixed fee        Percentage fee      Tax on fee                </text>
<text class="tx" x="70.60" y="364.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">  € [ 0.25    ]    [ 1.500 ] %         [ 23.000 ] %              </text>
<text class="tx" x="70.60" y="381.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">                                       0 = no tax                </text>
<text class="tx" x="70.60" y="415.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">  Example: a €62.00 card charge attracts                         </text>
<text class="tx" x="70.60" y="432.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">           €0.25 + €0.93 = €1.18, +23% tax €0.27 = €1.45         </text>
<text class="tx" x="70.60" y="449.50" textLength="522.60" lengthAdjust="spacingAndGlyphs">                                              [ Reset to default ] </text>
<text class="tx" x="70.60" y="500.50" textLength="507.00" lengthAdjust="spacingAndGlyphs"> Pay By Card (Helix-Pay)                                         </text>
<text class="tx" x="70.60" y="534.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">  Fixed fee        Percentage fee      Tax on fee                </text>
<text class="tx" x="70.60" y="551.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">  € [ 0.20    ]    [ 1.750 ] %         [ 23.000 ] %              </text>
<text class="tx" x="70.60" y="585.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">  Example: a €62.00 card charge attracts                         </text>
<text class="tx" x="70.60" y="602.50" textLength="507.00" lengthAdjust="spacingAndGlyphs">           €0.20 + €1.09 = €1.29, +23% tax €0.30 = €1.59         </text>
<text class="tx" x="70.60" y="619.50" textLength="522.60" lengthAdjust="spacingAndGlyphs">                                              [ Reset to default ] </text>
<text class="tx" x="47.20" y="670.50" textLength="546.00" lengthAdjust="spacingAndGlyphs">  ⓘ Pay Offline never carries a handling fee.                         </text>
<text class="tx" x="23.80" y="721.50" textLength="592.80" lengthAdjust="spacingAndGlyphs">                                          [ Cancel ]  [ Create type ]       </text>
